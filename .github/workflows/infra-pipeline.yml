name: Infra DevSecOps Pipeline (Terraform + LocalStack)

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-pipeline.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.7.5'
  AWS_REGION: 'us-east-1'
  AWS_ACCESS_KEY_ID: 'test'
  AWS_SECRET_ACCESS_KEY: 'test'
  AWS_DEFAULT_REGION: 'us-east-1'

jobs:
  # =========================================================
  # GATE 1: Secret Scanning (Shift Left)
  # =========================================================
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # GATE 2: IaC Security Scan (Checkov) + Terraform Validate
  # =========================================================
  iac-scan-and-validate:
    needs: secret-scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          check: 'CKV_AWS_*'
          skip_check: 'CKV_AWS_18,CKV_AWS_20,CKV_AWS_57,CKV_AWS_144'

      - name: Upload Checkov SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./terraform/checkov.sarif

  # =========================================================
  # GATE 3: Terraform Plan (contra LocalStack simulado)
  # =========================================================
  terraform-plan:
    needs: iac-scan-and-validate
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEBUG: 1
          PERSISTENCE: 0
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Wait for LocalStack to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; then
              echo "✅ LocalStack ready!"
              exit 0
            fi
            echo "⏳ Waiting for LocalStack... ($i/30)"
            sleep 2
          done
          echo "❌ LocalStack failed to start"
          exit 1

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ENDPOINT_URL: http://localhost:4566

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          TF_VAR_localstack_endpoint: http://localhost:4566

      - name: Upload Terraform Plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./terraform/tfplan
          retention-days: 5

  # =========================================================
  # GATE 4: Terraform Apply (Só em main/develop, contra LocalStack)
  # =========================================================
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      )
    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEBUG: 1
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Wait for LocalStack
        run: |
          for i in {1..30}; do
            curl -s http://localhost:4566/_localstack/health && break
            sleep 2
          done

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ENDPOINT_URL: http://localhost:4566

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          TF_VAR_localstack_endpoint: http://localhost:4566

      - name: Show Terraform Outputs
        run: terraform output
        env:
          AWS_ENDPOINT_URL: http://localhost:4566s