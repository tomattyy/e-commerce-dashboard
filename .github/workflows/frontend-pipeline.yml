name: Frontend DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
      - 'feat/**' 
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pipeline.yml'

jobs:
  # GATE 1: Secrets Prevention
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks Scan 
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # GATE 2: Static Analisys (SAST) and Dependencies (SCA)
  sast-sca-scan:
    needs: secret-scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 
        uses: actions/setup-node@v5
        with: 
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run SCA (Dependencies Audit)
        run: npm audit --audit-level=high

      - name: Run SAST (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  # GATE 3: Container Analisys (After-Build)
  build-and-scan-container:
    needs: sast-sca-scan
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildxd
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Local)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: e-commerce-dashboard-frontend:latest
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'e-commerce-dashboard-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # GATE 4: Push to Docker Hub (Only deploy branches if all pass)
  # Só faz push se for main, develop, release ou hotfix.
  push-to-registry:
    needs: build-and-scan-container
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/heads/hotfix'))
       
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      # Lógica de Tags baseada na branch (GitFlow)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-dashboard-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
      
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-dashboard-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/e-commerce-dashboard-frontend:${{ github.sha }}